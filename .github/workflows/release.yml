# Push a tag that matches Cargo.toml (e.g. v0.1.0) to build every platform
# and publish a GitHub release with checksums and the installers attached.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: linux
            arch: arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - os: macos
            arch: x64
            runner: macos-latest
            target: x86_64-apple-darwin
          - os: windows
            arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Tag matches Cargo.toml
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG doesn't match Cargo.toml version $version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig1-dev

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: nfpm (builds the .deb and .rpm)
        if: matrix.os == 'linux'
        run: |
          arch="$(uname -m | sed 's/aarch64/arm64/')"
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_${arch}.tar.gz" \
            | sudo tar -xz -C /usr/local/bin nfpm

      - name: Inno Setup (builds Setup.exe)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          $dir = Join-Path $env:RUNNER_TEMP 'inno'
          Invoke-WebRequest -UseBasicParsing -OutFile $installer -Uri https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe
          $p = Start-Process $installer -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/PORTABLE=1', "/DIR=`"$dir`""
          if ($p.ExitCode) { throw "Inno Setup install exited with $($p.ExitCode)" }
          "ISCC=$dir\ISCC.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Package
        shell: bash
        run: |
          ext=""
          if [ "${{ matrix.os }}" = windows ]; then ext=".exe"; fi
          sh scripts/package.sh ${{ matrix.os }} ${{ matrix.arch }} \
            "target/${{ matrix.target }}/release/vitreus$ext" dist
          case "${{ matrix.os }}" in
            linux) expected="tar.gz deb rpm" ;;
            macos) expected="tar.gz dmg" ;;
            windows) expected="zip" ;;
          esac
          for kind in $expected; do
            test -s "dist/vitreus-${{ matrix.os }}-${{ matrix.arch }}.$kind" || { echo "::error::missing .$kind"; exit 1; }
          done
          if [ "${{ matrix.os }}" = windows ]; then test -s dist/vitreus-setup-x64.exe; fi
          ls -l dist

      # Install what we're about to publish, the way users will.
      - name: Try the .deb and .rpm (Ubuntu, Fedora, openSUSE)
        if: matrix.os == 'linux'
        run: |
          pkg="vitreus-linux-${{ matrix.arch }}"
          docker run --rm -v "$PWD/dist:/dist:ro" ubuntu:24.04 sh -ec \
            "apt-get update -qq && apt-get install -y -qq /dist/$pkg.deb >/dev/null && vitreus --version && test -f /usr/share/applications/vitreus.desktop"
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:latest sh -ec \
            "dnf install -y -q /dist/$pkg.rpm && vitreus --version"
          docker run --rm -v "$PWD/dist:/dist:ro" opensuse/tumbleweed sh -ec \
            "zypper --non-interactive -q install --allow-unsigned-rpm /dist/$pkg.rpm && vitreus --version"

      - name: Try Setup (silent install and uninstall)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $p = Start-Process dist\vitreus-setup-x64.exe -Wait -PassThru -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/TASKS=addtopath'
          if ($p.ExitCode) { throw "Setup exited with $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Vitreus'
          & "$dir\vitreus.exe" --version
          if ($LASTEXITCODE) { throw 'vitreus --version failed' }
          if (-not (Get-ItemProperty 'HKCU:\Software\RegisteredApplications' -Name Vitreus -ErrorAction SilentlyContinue)) { throw 'not registered' }
          if ([Environment]::GetEnvironmentVariable('Path', 'User') -notlike "*$dir*") { throw 'not on PATH' }
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          for ($i = 0; ($i -lt 60) -and (Test-Path "$dir\vitreus.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$dir\vitreus.exe") { throw 'uninstall left vitreus.exe behind' }
          if (Get-ItemProperty 'HKCU:\Software\RegisteredApplications' -Name Vitreus -ErrorAction SilentlyContinue) { throw 'still registered' }
          if ([Environment]::GetEnvironmentVariable('Path', 'User') -like "*$dir*") { throw 'still on PATH' }

      - name: Check the disk image
        if: matrix.os == 'macos'
        run: hdiutil verify "dist/vitreus-macos-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: vitreus-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums, installers and update feed
        run: |
          cp install.sh install.ps1 dist/
          # The app's update check reads this from releases/latest/download/.
          printf '{"version": "%s", "tag": "%s", "url": "https://github.com/%s/releases/tag/%s"}\n' \
            "${TAG#v}" "$TAG" "$GITHUB_REPOSITORY" "$TAG" > dist/latest.json
          cd dist
          sha256sum vitreus-* install.sh install.ps1 latest.json > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            prerelease=""
            case "$TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" dist/* --verify-tag --title "Vitreus $TAG" --generate-notes $prerelease
          fi

  # Scoop bucket (Nominy/scoop-bucket), Homebrew tap (Nominy/homebrew-tap) and
  # winget. Each step is skipped until its token secret exists; pre-releases
  # (tags with a "-") are never published to package managers.
  packages:
    needs: publish
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    env:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Render manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --pattern SHA256SUMS --dir release
          sh scripts/render-packages.sh "$TAG" release/SHA256SUMS packages

      - name: Push Scoop bucket and Homebrew tap
        if: env.PACKAGES_TOKEN != ''
        run: |
          push() {
            repo="$1"; from="$2"; to="$3"
            dir="$(mktemp -d)"
            git clone --depth 1 "https://x-access-token:${PACKAGES_TOKEN}@github.com/$repo.git" "$dir"
            mkdir -p "$dir/$(dirname "$to")"
            cp "$from" "$dir/$to"
            git -C "$dir" add "$to"
            if git -C "$dir" diff --cached --quiet; then echo "$repo already up to date"; return; fi
            git -C "$dir" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "vitreus $TAG"
            git -C "$dir" push
          }
          push Nominy/scoop-bucket packages/scoop/vitreus.json bucket/vitreus.json
          push Nominy/homebrew-tap packages/homebrew/Casks/vitreus.rb Casks/vitreus.rb

      - name: Submit to winget
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Nominy.Vitreus
          release-tag: ${{ env.TAG }}
          installers-regex: 'windows-x64\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: package-manifests
          path: packages
