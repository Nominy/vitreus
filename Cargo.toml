[package]
name = "vitreus"
version = "0.2.0"
edition = "2024"
description = "A fast, no-nonsense photo viewer"
license = "MIT"
repository = "https://github.com/Nominy/vitreus"
homepage = "https://nominy.github.io/vitreus"
default-run = "vitreus"

[dependencies]
anyhow = "1"
fast_image_resize = "6"
futures = "0.3"
gpui = "0.2.2"
image = "0.25.6"
jxl-oxide = "0.12"
kamadak-exif = "0.6"
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
trash = "5"

# Feature set matches what gpui already enables, so this adds no extra compile.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-registry = "0.5"

# HEIC/AVIF backends use the OS decoders; these are already in gpui's tree.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
foreign-types = "0.5"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
libloading = "0.8"

[build-dependencies]
embed-resource = "3"

[profile.release]
strip = true

# Image decoding is unusably slow unoptimized; keep dev builds snappy.
[profile.dev.package."*"]
opt-level = 3
